# Tarifas por millón de tokens, en dólares, para el tramo de contexto corto y
# procesamiento estándar.
#
# `verified = true` significa que la fila se ha contrastado contra la página de
# precios del proveedor en la fecha de `verified_on`. El informe avisa de toda
# fila sin verificar y no debe citarse en la memoria ninguna cifra de coste que
# provenga de una.
#
#   https://platform.openai.com/docs/pricing
#   https://docs.claude.com/en/docs/about-claude/pricing

verified_on = "2026-09-21"

# --- OpenAI, modelos actuales --------------------------------------------
# Verificados el 2026-09-21 en platform.openai.com/docs/pricing, tabla
# "Flagship models", modo estándar y contexto corto.

[models."gpt-6-astra"]
provider = "openai"
input_per_mtok = 10.00
cached_input_per_mtok = 1.00
output_per_mtok = 50.00
verified = true

[models."gpt-5.6-sol"]
provider = "openai"
input_per_mtok = 4.00
cached_input_per_mtok = 0.40
output_per_mtok = 20.00
verified = true
# Precio promocional vigente al menos hasta el 21 de noviembre de 2026. Si la
# memoria cita este coste, conviene hacer constar esa condición.

[models."gpt-5.6-terra"]
provider = "openai"
input_per_mtok = 2.00
cached_input_per_mtok = 0.20
output_per_mtok = 12.00
verified = true

[models."gpt-5.6-luna"]
provider = "openai"
input_per_mtok = 0.20
cached_input_per_mtok = 0.02
output_per_mtok = 1.20
verified = true

# --- OpenAI, modelos anteriores ------------------------------------------
# NO VERIFICADOS. El 2026-09-21 estos dos modelos ya no figuran en las tablas de
# la página de precios, que recoge la generación gpt-5.6 y gpt-6. Siguen siendo
# invocables por la API, pero su tarifa no se ha podido contrastar: las cifras de
# abajo son las que tenía el fichero y se conservan solo para no perder el
# historial de las tandas ya ejecutadas con ellos.
#
# No citar estos costes en la memoria. Si se quiere comparar coste entre modelos,
# usar los de la generación actual, cuyas tarifas sí están verificadas.

[models."gpt-4.1-mini"]
