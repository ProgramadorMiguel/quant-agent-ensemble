output_per_mtok = 1.60
verified = false

[models."gpt-4.1"]
provider = "openai"
input_per_mtok = 2.00
cached_input_per_mtok = 0.50
output_per_mtok = 8.00
verified = false

# --- Anthropic ------------------------------------------------------------
# Verificados el 2026-09-21 en docs.claude.com/en/docs/about-claude/pricing,
# tabla "Model pricing". La columna de caché es la de "cache hits and refreshes";
# las escrituras en caché se facturan aparte y a mayor precio, pero el sistema no
# las declara por separado y quedan contabilizadas como entrada a tarifa plena,
# de modo que el coste que se informa es conservador.
#
# Los identificadores son los que figuran como "Claude API ID" en la tabla
# comparativa de modelos.

[models."claude-fable-5-1"]
provider = "anthropic"
input_per_mtok = 10.00
cached_input_per_mtok = 0.25
output_per_mtok = 50.00
verified = true
# Los aciertos de caché de este modelo se facturan a 0,025 veces la entrada, no a
# las 0,1 veces habituales del resto.

[models."claude-opus-5"]
provider = "anthropic"
input_per_mtok = 5.00
cached_input_per_mtok = 0.50
output_per_mtok = 25.00
verified = true

